name: 团队协作检查
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: team-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  team-check:
    name: 仓库格式与已提交练习
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            learning/requirements.txt
            requirements.txt
            constraints.txt
      - name: 安装检查与练习依赖
        run: python -m pip install -r learning/requirements.txt ruff==0.8.2
      - name: 仓库交付边界检查
        run: python tools/check_repository.py
      - name: Python 格式和语法
        run: |
          python -m ruff check . --select E,F,I --ignore E501
          python -m compileall -q src tools learning app.py run_pipeline.py check_environment.py
      - name: 检查实际已提交的个人练习
        run: python tools/exercises.py check-all
      - name: 运行团队已经编写的业务测试
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys

          tests = list(pathlib.Path('tests').rglob('test_*.py'))
          if tests:
              subprocess.check_call([sys.executable, '-m', 'pip', 'install', '-r', 'requirements.txt'])
              subprocess.check_call([sys.executable, '-m', 'pytest', '-q', 'tests'])
          else:
              print('尚无业务测试提交；不代表系统已经验收')
          PY
